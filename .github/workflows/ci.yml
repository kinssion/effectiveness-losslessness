name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/el_tokenization tests scripts
      - run: uv run mypy src/el_tokenization scripts
      - run: uv run pytest
      - run: uv run el-token smoke --steps 100
      - run: uv run el-token paper verify
      - run: uv run el-token paper tables --output-root paper/figure_data
      - run: uv run el-token paper figures --output-root paper/figure_data
